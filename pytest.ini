[pytest]
env_files =
    tests/.env.test
# Override container env vars with values from tests/.env.test. Without this,
# tests run inside the running container inherit prod-ish OIDC_ISSUER_URL /
# OIDC_CLIENT_ID values and assertions pinning those constants to the test
# fixtures fail. See the launchpad alpha-to-prod doc for the history.
env_override_existing_values = 1
